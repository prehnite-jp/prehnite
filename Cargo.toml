[package]
name = "prehnite"
version = "0.1.0"
edition = "2024"
license = "Zlib"
authors = ["saku-shirakura<saku@sakushira.com>"]
description = "Coming soon"

[dependencies]
chrono = "0.4.42"
iced = { version = "0.14.0", features = ["tokio"] }
iced_aw = "0.13.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros"] }
native-dialog = { version = "0.9.4", features = ["async"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rhai = "1.23.6"
