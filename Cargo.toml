[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Zlib"
authors = ["saku-shirakura<saku@sakushira.com>"]
repository = "https://github.com/saku-shirakura/prehnite"
homepage = "https://prehnite.jp/"
publish = false

[workspace.dependencies]
prehnite-shared = { version = "0.1.0", path = "crates/shared" }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "uuid"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["local-time", "env-filter"] }
tracing = { version = "0.1", features = ["log"] }
tracing-appender = "0.2"
serde_json = "1"
zip = "9"
anyhow = "1"
thiserror = "2"
tracing-unwrap = "1"
strum = { version = "0.28", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
fallible-iterator = "0.3.0"
tantivy = { version = "0.27" }
lindera-tantivy = { version = "6", features = ["embed-ipadic"] }
derive_builder = "0.20.2"
lindera = "6"
random_color = { version = "1", features = ["palette_support"] }
palette = { version = "0.7", features = ["serializing"] }
zstd = "0.14"
jiff = { version = "0.2", features = ["serde"] }
jiff-sqlx = { version = "0.2", features = ["sqlite"] }
time = { version = "0.3", features = [] }
debug-ignore = "1"
prehnite-data = { version = "1", path = "./crates/data", features = ["gpui"] }
uuid = { version = "1", features = ["serde"] }
gpui-kit = { version = "0.10" }
rust-i18n = "4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true