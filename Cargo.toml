[workspace]
members = ["src-tauri", "crates/*"]
resolver = "3"
default-members = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Zlib"
authors = ["saku-shirakura<saku@sakushira.com>"]
repository = "https://github.com/saku-shirakura/prehnite"
homepage = "https://prehnite.jp/"
rust-version = "1.92"
publish = false

[workspace.dependencies]
prehnite-core = { version = "0.1.0", path = "crates/core" }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "fs"] }
native-dialog = { version = "0.9", features = ["async"] }
serde = { version = "1", features = ["derive"] }
rhai = { version = "1", features = ["serde"] }
reqwest = { version = "0.13", features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter"] }
paste = "1"
derive_more = { version = "2", features = ["eq"] }
sys-locale = "0.3"
tracing = { version = "0.1", features = ["log"] }
tracing-appender = "0.2"
serde_json = "1"
zip = "8"
anyhow = "1"
thiserror = "2"
tracing-unwrap = "1"
strum = { version = "0.28", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
syn = { version = "2", features = ["full", "extra-traits"] }
proc-macro2 = "1"
quote = "1"
structmeta = "0.3.0"
convert_case = "0.11.0"
easy-settings = "0.3.1"
fallible-iterator = "0.3.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true