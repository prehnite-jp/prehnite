[package]
name = "prehnite"
version = "0.1.0"
edition = "2024"
license = "Zlib"
authors = ["saku-shirakura<saku@sakushira.com>"]
description = "Writing support software that helps you create coherent sentences"
repository = "https://github.com/saku-shirakura/prehnite"
homepage = "https://prehnite.jp/"
build = "build.rs"

[dependencies]
chrono = "0.4"
iced = { version = "0.14", features = ["tokio"] }
iced_aw = "0.13"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
native-dialog = { version = "0.9", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = { version = "1", features = ["serde"] }
reqwest = { version = "0.13", features = ["json"] }
log = "0.4"
tracing-subscriber = "0.3"
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["unic-langid-macros"] }
intl-memoizer = "0.5"
paste = "1"
derive_more = { version = "2", features = ["eq"] }

[dev-dependencies]
rand = "0.9"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
